{% extends 'jobs/base.html' %}
{% block content %}
<div class="max-w-xl mx-auto px-6 py-20 text-center">
    <div class="bg-white rounded-[24px] p-10 shadow-xl border">
        <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto text-2xl"><i class="fa-solid fa-check"></i></div>
        <h2 class="text-2xl font-bold mt-5">Application Submitted!</h2>
        <p class="text-slate-500 mt-2 text-sm">Your application for <b>{{ job.title }}</b> at {{ job.company }} has been received. We will contact you soon.</p>
        <div class="mt-6 flex gap-3 justify-center">
            <a href="/" class="bg-slate-900 text-white px-6 py-2.5 rounded-full text-sm font-bold">Browse More Jobs</a>
            <a href="/admin/" class="bg-white border px-6 py-2.5 rounded-full text-sm font-bold">View in Admin</a>
        </div>
    </div>
</div>
{% endblock %}
